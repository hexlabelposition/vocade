<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Vocade</title>
  </head>
  <body>
    <main class="app">
      <header class="top">
        <h1>Vocade</h1>
        <div class="seg" role="radiogroup" aria-label="Формат">
          <button data-format="CODE128" aria-pressed="true">Code128</button>
          <button data-format="QR" aria-pressed="false">QR</button>
        </div>
      </header>

      <section class="code-box" id="codeBox" aria-live="polite">
        <svg id="barcode"></svg>
        <div id="qr" hidden></div>
        <p class="placeholder" id="placeholder">Скажи цифры или введи вручную</p>
      </section>

      <div class="input-row">
        <input id="digits" inputmode="numeric" autocomplete="off" placeholder="Цифры" />
        <button id="backspace" class="ghost" aria-label="Удалить последнюю цифру">⌫</button>
        <button id="clear" class="ghost">Сброс</button>
      </div>

      <p class="partial" id="partial">&nbsp;</p>

      <button id="mic" class="mic loading">
        <span id="micLabel">Говорить</span>
        <span class="spinner" role="status" aria-label="Модель загружается"></span>
      </button>
      <p class="status" id="status"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
